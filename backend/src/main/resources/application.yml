server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: offline-archive-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:offline_archive}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configuración de Seguridad y JWT
app:
  jwt:
    # Clave secreta HMAC-SHA256 (mínimo 256 bits codificados en Base64 o string robusto)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000        # 15 minutos (15 * 60 * 1000)
    refresh-token-expiration-ms: 604800000    # 7 días (7 * 24 * 60 * 60 * 1000)
    refresh-token-cookie-name: offline_archive_refresh_token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Configuración de Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
