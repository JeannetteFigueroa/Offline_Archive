<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Permite que el diseño se adapte correctamente a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>(Off)line Archive</title>

    <!-- CSS exclusivo de la página principal -->
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="home">

        <!-- =================================================
             HERO / PORTADA PRINCIPAL
             ================================================= -->

        <section class="hero">

            <!-- Contenido textual del hero -->
            <div class="hero-content">

                <!-- Nombre de la tienda -->
                <p class="hero-brand">(Off)line Archive</p>

                <!-- Título principal -->
                <h1 class="hero-title">
                    <span>ESTO NO ES</span>
                    <span>EL FUTURO.</span>
                    <span class="neon-text">
                        ES EL ARCHIVO.
                    </span>
                </h1>

                <!-- Texto complementario -->
                <p class="hero-description">
                    Ropa seleccionada del archivo.
                    Estética underground.
                    Piezas que no siguen tendencias.
                </p>

                <!-- Botón hacia la colección -->
                <a href="#" class="hero-button">
                    <span>VER COLECCIÓN</span>
                    <span>→</span>
                </a>

            </div>


            <!-- =================================================
                 INFORMACIÓN VISUAL DEL ARCHIVO
                 ================================================= -->

            <div class="archive-interface">

                <!-- Decoración superior -->
                <div class="archive-plus">
                    +
                </div>

                <!-- Información de imagen -->
                <div class="archive-item active">
                    <span>IMG_0047</span>
                    <span>+</span>
                </div>

                <!-- Información del archivo -->
                <div class="archive-item">
                    <span>ARCHIVE / 2003</span>
                </div>

                <!-- Sistema -->
                <div class="archive-item">
                    <span>SYSTEM_01</span>
                    <span>+</span>
                </div>

                <!-- Drop -->
                <div class="archive-item">
                    <span>DROP 07</span>
                    <span>+</span>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
