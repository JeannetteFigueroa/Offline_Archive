<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="(Off)line Archive — Collections"
    >

    <title>(Off)line Archive — Collections</title>


    <!-- =====================================================
         GLOBAL THEME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/theme.css"
    >


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >


    <!-- =====================================================
         COLLECTIONS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/collection.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->
    <header class="navbar">
        <a href="index.html" class="navbar-logo">(Off)line Archive</a>

        <nav class="navbar-menu" aria-label="Navegación principal">
            <a href="#">Accesorios</a>
            <a href="#">Colección y3k</a>
            <a href="#">Sobre<br>Nosotros</a>
            <a href="#">Contacto</a>
        </nav>

        <nav class="navbar-actions" aria-label="Acciones de usuario">
            <a href="#">Buscar</a>
            <a href="login.html" id="accountLink">Login</a>
            <a href="#" class="navbar-cart">
                <span>Carrito</span>
                <span class="cart-count">0</span>
            </a>
        </nav>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="mobileMenu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <aside class="mobile-menu" id="mobileMenu" aria-hidden="true">
            <div class="mobile-menu-header">
                <span>MENU_01</span>
                <button class="menu-close" type="button" aria-label="Cerrar menú">×</button>
            </div>

            <nav class="mobile-menu-links" aria-label="Navegación móvil">
                <a href="#"><span>01</span>Accesorios</a>
                <a href="#"><span>02</span>Colección y3k</a>
                <a href="#"><span>03</span>Sobre Nosotros</a>
                <a href="#"><span>04</span>Contacto</a>

                <div class="mobile-divider"></div>

                <a href="#"><span>05</span>Buscar</a>
                <a href="login.html" id="mobileAccountLink"><span>06</span>Login</a>
                <a href="#" class="mobile-cart">
                    <span>07</span>Carrito <b>0</b>
                </a>
            </nav>

            <div class="mobile-menu-footer">
                SYSTEM_01
                <span>ONLINE</span>
            </div>
        </aside>
    </header>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main>


        <!-- =================================================
             COLLECTIONS SECTION
             ================================================= -->

        <section
            class="collections"
            aria-labelledby="collections-title"
        >


            <!-- PAGE TITLE -->

            <h1
                id="collections-title"
                class="collections-title"
            >
                COLLECTIONS.
            </h1>


            <!-- =================================================
                 COLLECTION GRID
                 ================================================= -->

            <div class="collections-grid">


                <!-- =================================================
                     COLLECTION 01 — TOPS
                     ================================================= -->

                <a
                    href="#"
                    class="collection-card"
                >

                    <img
                        src="assets\images\Photo_1.png"
                        alt="Colección Tops"
                    >

                    <div
                        class="collection-overlay"
                        aria-hidden="true"
                    ></div>


                    <span class="collection-number">
                        01
                    </span>


                    <h2 class="collection-name">
                        TOPS
                    </h2>


                    <span
                        class="collection-arrow"
                        aria-hidden="true"
                    >
                        ↗
                    </span>

                </a>



                <!-- =================================================
                     COLLECTION 02 — BOTTOMS
                     ================================================= -->

                <a
                    href="#"
                    class="collection-card"
                >

                    <img
                        src="assets\images\Photo_2.png"
                        alt="Colección Bottoms"
                    >

                    <div
                        class="collection-overlay"
                        aria-hidden="true"
                    ></div>


                    <span class="collection-number">
                        02
                    </span>


                    <h2 class="collection-name">
                        BOTTOMS
                    </h2>


                    <span
                        class="collection-arrow"
                        aria-hidden="true"
                    >
                        ↗
                    </span>

                </a>



                <!-- =================================================
                     COLLECTION 03 — ACCESSORIES
                     ================================================= -->

                <a
                    href="#"
                    class="collection-card"
                >

                    <img
                        src="assets\images\Photo_3.png"
                        alt="Colección Accessories"
                    >

                    <div
                        class="collection-overlay"
                        aria-hidden="true"
                    ></div>


                    <span class="collection-number">
                        03
                    </span>


                    <h2 class="collection-name">
                        ACCESSORIES
                    </h2>


                    <span
                        class="collection-arrow"
                        aria-hidden="true"
                    >
                        ↗
                    </span>

                </a>



                <!-- =================================================
                     COLLECTION 04 — OUTERWEAR
                     ================================================= -->

                <a
                    href="#"
                    class="collection-card"
                >

                    <img
                        src="assets\images\Photo_4.png"
                        alt="Colección Outerwear"
                    >

                    <div
                        class="collection-overlay"
                        aria-hidden="true"
                    ></div>


                    <span class="collection-number">
                        04
                    </span>


                    <h2 class="collection-name">
                        OUTERWEAR
                    </h2>


                    <span
                        class="collection-arrow"
                        aria-hidden="true"
                    >
                        ↗
                    </span>

                </a>

            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/navbar.js"></script>

</body>

</html>
